# Feed adapter configuration (design S6, F-13/F-14/F-16).
# `cisa_kev` intentionally carries no `source_confidence`: KEV never
# enters `ioc_source` or a lookup's `sources[]` (F-14) and scores only
# through the `cve_exploited` component.

defaults:
  volume_halt_multiplier: 3

feeds:
  attack:
    kind: attack_stix
    group: mitre
    pin_spki_sha256: []

  cisa_kev:
    kind: cisa_kev
    group: cisa
    pin_spki_sha256: []

  urlhaus:
    kind: urlhaus
    group: abusech
    source_confidence: 85
    pin_spki_sha256: []
    min_consecutive_polls: 2
    ttl:
      ip: 14d
      domain: 14d
      url: 30d
      hash: 365d

  malwarebazaar:
    kind: malwarebazaar
    group: abusech
    source_confidence: 80
    pin_spki_sha256: []
    min_consecutive_polls: 2
    ttl:
      hash: 365d

  threatfox:
    kind: threatfox
    group: abusech
    source_confidence:
      cap: 90
    pin_spki_sha256: []
    min_consecutive_polls: 2
    ttl:
      ip: 14d
      domain: 14d
      url: 30d
      hash: 365d

  spamhaus_asndrop:
    kind: spamhaus_asndrop
    group: spamhaus
    pin_spki_sha256: []
    ttl:
      asn: 7d

  geoip_asn:
    kind: geoip_asn
    group: geoip
    pin_spki_sha256: []
    ttl:
      asn: 30d

  edge_reported:
    kind: edge_reported
    group: edge_reported
    source_confidence: 35
    ttl:
      default: 3d

  # Catalog/corpus reference feeds (ADR-0012 / ADR-0013). Advisory-only
  # knowledge, never scored, never in the query path. Fed from a pinned
  # release tarball via a signed bundle / `azctl feed`, not the online
  # scheduled-pull endpoint table; `corpus_version` is pinned at bundle-build
  # time (empty here = feed inert until pinned, fail-closed).
  engage:
    kind: engage
    group: mitre
    pin_spki_sha256: []

  sigma_corpus:
    kind: sigma_corpus
    group: sigmahq
    pin_spki_sha256: []
    corpus_version: ""
    license: "DRL 1.1"
    allowed_licenses:
      - "DRL 1.1"
    source_url: "https://github.com/SigmaHQ/sigma"

  yara_corpus:
    kind: yara_corpus
    group: yarahub
    pin_spki_sha256: []
    corpus_version: ""
    allowed_licenses:
      - "CC-BY-4.0"
      - "Apache-2.0"
      - "MIT"
      - "Unlicense"
      - "DRL 1.1"
    source_url: "https://github.com/Neo23x0/signature-base"
