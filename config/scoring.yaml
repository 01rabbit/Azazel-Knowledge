# Deterministic scoring configuration (ADR-0006, docs/scoring.md, design S5).
# `weights` and `confidence_weights` are loader-validated to sum to 1.0
# (tolerance 1e-9); the loader raises ConfigError otherwise.

weights:
  ioc_match: 0.30
  history: 0.20
  attack_map: 0.15
  cve_exploited: 0.15
  campaign: 0.10
  geo_asn: 0.10

freshness:
  half_life_days: 30
  floor: 0.2

components:
  ioc_match:
    source_count_curve:
      "1": 0.4
      "2": 0.7
      "3+": 1.0
    type_caps:
      ja3: 0.6
      ja4: 0.7
      ja3_corroborated: 0.9
      ja4_corroborated: 1.0
    corroboration:
      exact_match_types: [ip, domain, url, hash]
      history_threshold: 50

  history:
    burst_cap: 500
    half_saturation_count: 10
    trend_bonus: 10

  attack_map:
    single_basis_cap: 60

  cve_exploited:
    freshness_floor: 0.7
    applies_when: [eve_alert]

  campaign:
    ioc_overlap_weight: 0.7
    technique_overlap_weight: 0.3
    single_ref_cap: 40
    type_diversity_bonus: 10

  geo_asn: {}

confidence_weights:
  source_count: 0.30
  source_independence: 0.30
  source_freshness: 0.25
  local_corroboration: 0.15

confidence:
  source_count:
    max_distinct_groups: 4
  local_corroboration:
    floor: 0.3

recommendation:
  action_bands:
    - name: isolate
      condition: {score_gte: 85, confidence_gte: 70}
      rejected_alternatives: []

    - name: throttle
      condition: {score_gte: 60, confidence_gte: 50}
      rejected_alternatives:
        - action: isolate
          reason: "score or confidence below the isolate threshold"

    - name: redirect
      condition: {score_gte: 45, confidence_gte: 40}
      rejected_alternatives:
        - action: isolate
          reason: "score or confidence below the isolate threshold"
        - action: throttle
          reason: "score or confidence below the throttle threshold"

    - name: observe
      default: true
      rejected_alternatives:
        - action: isolate
          reason: "score or confidence below the isolate threshold"
        - action: throttle
          reason: "score or confidence below the throttle threshold"
        - action: redirect
          reason: "score or confidence below the redirect threshold"

context:
  deadline_ms: 220

stats:
  max_staleness_s: 120

research:
  shadow_scoring:
    enabled: false
    reaction_adjustments:
      mode: shadow
      max_delta: 30
      max_total_delta: 20

# AZ-06 deception-effectiveness advisory (ADR-0011, docs/azazel-deception-
# effectiveness.md). Deterministic inputs only: the advisory is a pure function
# of the stored deception_observation rows + these numbers + query_as_of, so the
# same 7-tuple replays byte-identically. Not weight-sum-validated (that check is
# only for top-level `weights`/`confidence_weights`); the whole file still folds
# into config_hash, so any edit here is visible in the determinism tuple.
# Engagement-effectiveness advisory (Knowledge#52). Advisory-only context folded
# from the immutable `reaction` and `behavior_pattern` lanes; never a scoring
# weight, never in the 7-element replay tuple. Absent block -> built-in
# conservative defaults in correlate/engagement_advisory.py.
engagement_advisory:
  version: 1
  # Fewer stored reactions than this yields NO advisory, not an empty one.
  minimum_reactions: 3
  # Below this confidence the advisory still reports what was observed, but
  # suggests no posture.
  posture_confidence_floor: 0.5
  # Prior decoy engagements required before `redirect_to_decoy` is a supported
  # activity rather than a guess.
  decoy_support_minimum: 2
  round_ndigits: 6

deception_effectiveness:
  version: 1
  confidence:
    base: 0.0
    per_observation: 0.05          # linear bonus per stored observation ...
    max_observation_bonus: 0.4     # ... saturating here
    ladder_layer_bonus: 0.2        # per honesty-ladder layer present (interaction/reaction/outcome)
    confounder_penalty: 0.15       # per DISTINCT confounder tag observed
    floor: 0.0
    ceil: 1.0
    round_ndigits: 6
  # Below this observation count the advisory reports insufficient evidence.
  insufficient_evidence_min_observations: 3
  # Runtime/context confounders that MUST be surfaced as counter-evidence and
  # subtracted before any effectiveness is claimed (narrative vs capacity).
  counter_evidence_confounders:
    - scanner_noise
    - internal_health_check
    - host_capacity
  # resource saturation at/above this fraction is a capacity confounder, not a
  # narrative signal (early disengagement may be saturation-driven).
  saturation_confounder_threshold: 0.85
