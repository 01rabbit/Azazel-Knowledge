[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-knowledge"
version = "0.1.0"
description = "Azazel-Knowledge Advisor: on-premises tactical threat knowledge advisor — advisory-only and deterministic (formerly Azazel-CTI)."
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "idna",
    "PyNaCl",
]

[project.optional-dependencies]
api = ["fastapi", "pydantic", "uvicorn"]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
