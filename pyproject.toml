[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azazel-knowledge"
version = "0.1.0"
description = "Azazel-Knowledge Advisor: on-premises tactical threat knowledge advisor — advisory-only and deterministic (formerly Azazel-CTI)."
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "idna",
    "PyNaCl",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "pydantic",
    "uvicorn",
    # Boundary contract source-of-truth (ADR-0010). api-extra only: imported
    # solely under azazel_knowledge.api / .taxii for payload validation; never
    # a core dependency (Absolute Constraint 7). Tag-pinned per Azazel-Fabric
    # design-principles §6.
    "azazel-fabric @ git+https://github.com/01rabbit/Azazel-Fabric.git@v0.3.0",
]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
