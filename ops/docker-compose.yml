# Azazel-Knowledge Phase 1 deployment (design S2/S11): exactly two containers,
# one writer. `worker` is the sole process that opens data/db/*.db for
# writing (db/writer.py:PrioritySingleWriterQueue, flock-guarded on
# var/run/{local,intel}.lock); `api` only ever opens read-only WAL
# connections. No other services belong in this file.
#
# Before first boot: `azctl provision --root .` (or the mounted host
# path this file's volumes point at) to create var/, data/db/, and
# secrets/, and to mint the first admin API client token.

services:
  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: azazel-knowledge:latest
    command:
      - gunicorn
      - azazel_knowledge.api.app:app
      - -k
      - uvicorn.workers.UvicornWorker
      - -w
      - "3"
      - --bind
      - "0.0.0.0:8443"
    ports:
      - "8443:8443"
    read_only: true
    tmpfs:
      - /tmp
      - /home/azazel/.gunicorn
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1280m
    pids_limit: 256
    environment:
      AZAZEL_ROOT: /app
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data:ro
      - ../var:/app/var
      - ../secrets:/app/secrets:ro
    # Liveness, not readiness. `/v1/health` requires Scope.READ, so an
    # unauthenticated probe gets 401 — which still proves gunicorn is up, the
    # ASGI app loaded, the router is mounted and the auth layer ran. Treating
    # 401 as live is deliberate: the alternative is baking a bearer token into
    # the deployment for a liveness check, and `/v1/health` reports generation,
    # cache state and audit-writer status, which is not for an unauthenticated
    # caller on a published port. Readiness (warm cache, audit writer healthy)
    # is an authenticated call and belongs to monitoring, not to this probe.
    # Before this accepted 401, a working container was marked unhealthy
    # forever (#10).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |-
          import sys, urllib.error, urllib.request as u
          try:
              sys.exit(0 if u.urlopen('http://127.0.0.1:8443/v1/health', timeout=3).status == 200 else 1)
          except urllib.error.HTTPError as exc:
              sys.exit(0 if exc.code == 401 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      worker:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    image: azazel-knowledge:latest
    command: ["python", "-m", "azazel_knowledge.worker", "--online", "--interval-s", "5"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    pids_limit: 64
    # Design S11/S7: reserve one core for the worker so a live bundle
    # build or feed pull never contends with the api's query-serving
    # cores. Adjust the cpuset index to your board's core count.
    cpuset: "3"
    environment:
      AZAZEL_ROOT: /app
    volumes:
      - ../config:/app/config:ro
      - ../data:/app/data
      - ../var:/app/var
      - ../secrets:/app/secrets
    healthcheck:
      test: ["CMD", "test", "-f", "/app/var/run/local.lock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
