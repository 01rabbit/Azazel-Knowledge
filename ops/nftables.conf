#!/usr/sbin/nft -f
# Azazel-Knowledge nftables ruleset (design S7).
#
# Contract: default-drop inbound; the only inbound service exposed
# anywhere is 8443, and only from the Edge management segment; outbound
# is a narrow allowlist -- one egress rule per feed adapter plus the
# pinned DNS resolver. Nothing else may originate or terminate a
# connection on this node. Load with:
#
#   nft -f ops/nftables.conf
#
# Set these two for your site before loading:

define MGMT_SEGMENT = 203.0.113.0/24    # Edge management segment (edge_allowlist)
define DNS_RESOLVER = 203.0.113.1       # pinned recursive resolver -- not "any DNS server"

flush ruleset

table inet azazel_knowledge {

    # ------------------------------------------------------------------
    # Feed adapter egress hosts (design S6/S7). nftables has no native
    # FQDN matching, so populate this set from a small cron job that
    # resolves each hostname and refreshes the elements (e.g. `nft add
    # element inet azazel_knowledge feed_egress_v4 { <resolved-ip> }`); ship
    # it empty and fail closed until that job has run at least once.
    # One feed per line below, matching worker.py:FEED_ENDPOINTS:
    #   - urlhaus.abuse.ch        (urlhaus)
    #   - bazaar.abuse.ch         (malwarebazaar)
    #   - threatfox.abuse.ch      (threatfox)
    #   - www.cisa.gov            (cisa_kev)
    #   - raw.githubusercontent.com (attack / MITRE ATT&CK STIX)
    #   - www.spamhaus.org        (spamhaus_asndrop)
    # geoip_asn is a local file feed and is never fetched over the
    # network -- it has no entry here by design.
    set feed_egress_v4 {
        type ipv4_addr
        flags interval
    }

    chain inbound {
        type filter hook input priority 0; policy drop;

        ct state established,related accept
        ct state invalid drop

        iif "lo" accept
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Edge -> CTI: bearer-token REST/TAXII inbox, nothing else.
        ip saddr $MGMT_SEGMENT tcp dport 8443 accept

        log prefix "azazel-knowledge-inbound-drop: " drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain outbound {
        type filter hook output priority 0; policy drop;

        ct state established,related accept
        oif "lo" accept

        # Pinned resolver only.
        ip daddr $DNS_RESOLVER udp dport 53 accept
        ip daddr $DNS_RESOLVER tcp dport 53 accept

        # Feed adapters: TLS to the allowlisted set above only. SPKI
        # pinning (feeds.yaml `pin_spki_sha256`) is the transport-layer
        # control; this is the network-layer counterpart.
        ip daddr @feed_egress_v4 tcp dport 443 accept

        log prefix "azazel-knowledge-outbound-drop: " drop
    }
}
