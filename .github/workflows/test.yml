name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AZAZEL_REQUIRE_FULL_CANDIDATE_SUITE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[api-context-candidate,dev]"

      - name: Require the pinned candidate Fabric contract
        run: python -c "import azazel_fabric.knowledge_context"

      - name: Require OpenSSL for isolated mTLS tests
        run: openssl version

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  check-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[api,dev]"

      - name: Validate configuration
        run: python azctl check-config --config-dir config

      - name: Docs sync check (allowlisted drift warns now, fails after T3 ratification)
        run: python tools/docs-sync-check.py

  stable-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install stable API dependencies
        run: pip install -e ".[api,dev]"

      - name: Verify stable Fabric install starts without the candidate endpoint
        run: |
          python - <<'PY'
          from azazel_knowledge.api.app import app
          assert "/v1/knowledge-context" not in {
              getattr(route, "path", None) for route in app.routes
          }
          PY

      - name: Run unit tests with the published Fabric profile
        run: python -m pytest tests/unit -q
